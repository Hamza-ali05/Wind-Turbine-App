[project]
name = "wind-suitability-backend"
version = "0.1.0"
description = "FastAPI + GIS/ML service for wind turbine site suitability in the Sindh Wind Corridor (AHP + Random Forest + OpenRouteService)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Wind Suitability Platform" }]
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "geopandas==1.1.4",
    "shapely==2.1.2",
    "pyproj==3.8.0",
    "rasterio==1.5.1",
    "rasterstats==0.21.0",
    "osmnx==2.1.1",
    "folium==0.20.0",
    "elevation==1.1.3",
    "scikit-learn==1.9.1",
    "pandas==3.0.5",
    "numpy==2.5.3",
    "joblib==1.6.0",
    "openrouteservice==2.3.3",
    "requests==2.34.2",
    "httpx==0.28.1",
    "sqlalchemy==2.0.54",
    "geoalchemy2==0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
